version: "3.9"

services:
  # ------------------------------------------------------------------
  # Backend FastAPI
  # ------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistant-reunions-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Depuis un conteneur Docker, "localhost" ne pointe pas vers l'hote :
      # on force les URLs internes vers les noms de services Docker.
      - OLLAMA_BASE_URL=http://ollama:11434
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - DATABASE_URL=sqlite:///./data/app.db
      - CHROMA_PERSIST_DIR=./data/chroma_db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - keycloak
      - ollama
    restart: unless-stopped
    networks:
      - assistant-network

  # ------------------------------------------------------------------
  # Frontend React (Vite, servi en mode dev pour simplicite)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assistant-reunions-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - assistant-network

  # ------------------------------------------------------------------
  # Keycloak (authentification)
  # ------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: assistant-reunions-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped
    networks:
      - assistant-network

  # ------------------------------------------------------------------
  # Ollama (LLM + embeddings, 100% local)
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: assistant-reunions-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - assistant-network
    # NOTE : apres le premier "docker-compose up", executer manuellement :
    #   docker exec -it assistant-reunions-ollama ollama pull qwen2.5:0.5b
    #   docker exec -it assistant-reunions-ollama ollama pull nomic-embed-text

networks:
  assistant-network:
    driver: bridge

volumes:
  keycloak-data:
  ollama-data: